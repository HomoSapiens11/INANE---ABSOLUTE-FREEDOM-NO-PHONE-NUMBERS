<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>INANE Чат</title>
    <!-- Подключаем клиентскую библиотеку Socket.io -->
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: sans-serif; display: flex; height: 100vh; margin: 0; }
        #sidebar { width: 250px; background: #f0f0f0; border-right: 1px solid #ccc; display: flex; flex-direction: column; }
        #chat-area { flex: 1; display: flex; flex-direction: column; }
        #usersList { list-style: none; padding: 0; margin: 0; overflow-y: auto; flex: 1; }
        #usersList li { padding: 10px; cursor: pointer; border-bottom: 1px solid #ddd; }
        #usersList li.active { background: #007bff; color: white; }
        #messages { flex: 1; padding: 20px; overflow-y: auto; background: #fafafa; display: flex; flex-direction: column; }
        .msg { margin-bottom: 10px; padding: 8px 12px; border-radius: 8px; max-width: 70%; word-wrap: break-word; }
        .msg.my { background: #dcf8c6; align-self: flex-end; }
        .msg.their { background: #fff; align-self: flex-start; border: 1px solid #eee; }
        .msg-author { font-weight: bold; font-size: 0.8em; color: #555; margin-bottom: 4px; }
        #input-panel { padding: 10px; display: flex; border-top: 1px solid #ccc; }
        #msgInput { flex: 1; padding: 10px; }
        #sendBtn { padding: 10px 20px; }
        #auth-panel { padding: 10px; border-bottom: 1px solid #ccc; }
    </style>
</head>
<body>

    <!-- Боковая панель с пользователями -->
    <div id="sidebar">
        <div id="auth-panel">
            <input type="text" id="usernameInput" placeholder="Ваш ник..." />
            <button id="loginBtn" onclick="register()">Войти</button>
        </div>
        <h3 style="padding: 0 10px;">Чаты</h3>
        <ul id="usersList">
            <!-- По умолчанию всегда есть Общий чат -->
            <li id="global-chat-item" class="active" onclick="switchChat('GLOBAL')">🌐 ОБЩИЙ ЧАТ</li>
        </ul>
    </div>

    <!-- Область чата -->
    <div id="chat-area">
        <h2 id="currentChatTitle" style="padding: 10px; margin: 0; background: #eee;">Чат: Глобальный</h2>
        <div id="messages"></div>
        <div id="input-panel">
            <input type="text" id="msgInput" placeholder="Введите сообщение..." disabled />
            <button id="sendBtn" onclick="sendMsg()" disabled>Отправить</button>
        </div>
    </div>

    <script>
        const socket = io(); // Инициализация сокета
        let currentChat = 'GLOBAL'; // Текущая комната по умолчанию
        const usernameInput = document.getElementById('usernameInput');

        // 1. Регистрация пользователя на сервере
        function register() {
            const username = usernameInput.value.trim();
            if (!username) return alert('Введите ник!');
            
            socket.emit('register user', username);
            
            // Активируем поля ввода сообщений после ввода ника
            usernameInput.disabled = true;
            document.getElementById('loginBtn').disabled = true;
            document.getElementById('msgInput').disabled = false;
            document.getElementById('sendBtn').disabled = false;

            // Сразу запрашиваем историю для общего чата
            socket.emit('get history', { myNick: username, target: 'GLOBAL' });
        }

        // 2. Смена активного чата (клик по пользователю или Общему чату)
        function switchChat(target) {
            currentChat = target;
            
            // Меняем заголовок
            document.getElementById('currentChatTitle').textContent = `Чат: ${target === 'GLOBAL' ? 'Общий' : target}`;
            
            // Подсвечиваем активный элемент в списке
            document.querySelectorAll('#usersList li').forEach(li => li.classList.remove('active'));
            if (target === 'GLOBAL') {
                document.getElementById('global-chat-item').classList.add('active');
            } else {
                const activeLi = Array.from(document.querySelectorAll('#usersList li')).find(li => li.textContent === target);
                if (activeLi) activeLi.classList.add('active');
            }

            // Очищаем окно сообщений и запрашиваем историю для нового чата
            document.getElementById('messages').innerHTML = '';
            const myNick = usernameInput.value.trim();
            if (myNick) {
                socket.emit('get history', { myNick: myNick, target: currentChat });
            }
        }

        // 3. Обновление списка пользователей онлайн
        socket.on('update users', (onlineUsers) => {
            const list = document.getElementById('usersList');
            const myNick = usernameInput.value.trim();
            
            // Сохраняем первый элемент (Общий чат)
            list.innerHTML = `<li id="global-chat-item" class="${currentChat === 'GLOBAL' ? 'active' : ''}" onclick="switchChat('GLOBAL')">🌐 ОБЩИЙ ЧАТ</li>`;
            
            onlineUsers.forEach(user => {
                // Не добавляем в список самого себя
                if (user !== myNick) {
                    const li = document.createElement('li');
                    li.textContent = user;
                    if (currentChat === user) li.className = 'active';
                    li.onclick = () => switchChat(user);
                    list.appendChild(li);
                }
            });
        });

        // 4. Загрузка истории сообщений с сервера
        socket.on('load history', (data) => {
            // Проверяем, что пришедшая история именно для того чата, который сейчас открыт
            if (data.target === currentChat) {
                document.getElementById('messages').innerHTML = ''; // на всякий случай чистим
                data.history.forEach(msg => {
                    renderMessage(msg, true); // true означает, что при истории скроллим плавно или без задержек
                });
            }
        });

        // 5. Получение нового сообщения в реальном времени
        socket.on('new message', (msg) => {
            renderMessage(msg);
        });

        // Исправленная безопасная функция рендеринга сообщений
        function renderMessage(msg) {
            const box = document.getElementById('messages');
            const myNick = usernameInput.value.trim();
            
            const isGlobalMatch = currentChat === 'GLOBAL' && msg.to === 'GLOBAL';
            const isPrivateMatch = currentChat !== 'GLOBAL' && (msg.sender === currentChat || (msg.sender === myNick && msg.to === currentChat));

            if (!isGlobalMatch && !isPrivateMatch) return; 

            const isMy = msg.sender === myNick;
            const div = document.createElement('div');
            div.className = `msg ${isMy ? 'my' : 'their'}`;

            const authorDiv = document.createElement('div');
            authorDiv.className = 'msg-author';
            authorDiv.textContent = msg.sender;

            const textSpan = document.createElement('span');
            textSpan.textContent = msg.text; // Экранирование XSS

            div.appendChild(authorDiv);
            div.appendChild(textSpan);
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        function sendMsg() {
            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            const myNick = usernameInput.value.trim() || 'Аноним';

            if (text !== '') {
                socket.emit('send message', {
                    sender: myNick,
                    to: currentChat,
                    text: text
                });
                input.value = '';
            }
        }

        document.getElementById('msgInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') sendMsg();
        });
    </script>
</body>
</html>
