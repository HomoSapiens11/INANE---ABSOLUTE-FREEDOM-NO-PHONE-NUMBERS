<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>INANE 4.0 — Telegram Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0e0e10; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        .app-container { width: 900px; height: 600px; background: #18181c; border-radius: 16px; border: 1px solid #2a2a30; display: flex; overflow: hidden; box-shadow: 0 0 40px rgba(0, 255, 204, 0.15); }
        
        /* БОКОВАЯ ПАНЕЛЬ (ЧАТЫ) */
        .sidebar { width: 280px; background: #121215; border-right: 1px solid #2a2a30; display: flex; flex-direction: column; }
        .profile-box { padding: 15px; border-bottom: 1px solid #2a2a30; background: #18181c; }
        .profile-box input { width: 100%; padding: 8px 12px; background: #222228; border: 1px solid #33333d; border-radius: 8px; color: #00ffcc; font-weight: bold; outline: none; }
        
        .chats-list { flex: 1; overflow-y: auto; }
        .chat-item { padding: 14px 18px; border-bottom: 1px solid #1c1c22; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: space-between; }
        .chat-item:hover, .chat-item.active { background: #00ffcc22; border-left: 4px solid #00ffcc; }
        .chat-name { font-weight: bold; font-size: 14px; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; max-width: 160px; }
        .online-tag { font-size: 10px; color: #00ffcc; background: #00ffcc11; padding: 2px 6px; border-radius: 10px; font-weight: bold; }

        /* ОКНО СООБЩЕНИЙ */
        .main-chat { flex: 1; display: flex; flex-direction: column; background: #16161a; }
        .chat-header { padding: 15px 20px; background: #18181c; border-bottom: 1px solid #2a2a30; font-weight: bold; color: #00ffcc; display: flex; justify-content: space-between; align-items: center; }
        
        .messages-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        
        .msg { max-width: 70%; padding: 10px 14px; border-radius: 12px; font-size: 13px; line-height: 1.4; word-break: break-word; position: relative; }
        .msg.my { align-self: flex-end; background: #00c896; color: #000; border-bottom-right-radius: 2px; font-weight: 500; }
        .msg.their { align-self: flex-start; background: #26262e; color: #fff; border-bottom-left-radius: 2px; border: 1px solid #33333d; }
        .msg-author { font-size: 10px; opacity: 0.7; margin-bottom: 3px; font-weight: bold; }

        .input-area { padding: 15px; background: #18181c; border-top: 1px solid #2a2a30; display: flex; gap: 10px; }
        .input-area input { flex: 1; padding: 12px; background: #222228; border: 1px solid #33333d; border-radius: 10px; color: #fff; outline: none; }
        .input-area input:focus { border-color: #00ffcc; }
        .input-area button { padding: 12px 20px; background: #00ffcc; color: #000; font-weight: bold; border: none; border-radius: 10px; cursor: pointer; text-transform: uppercase; }
        .input-area button:hover { background: #00cca3; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- БОКОВАЯ ПАНЕЛЬ С ЧАТАМИ -->
        <div class="sidebar">
            <div class="profile-box">
                <input type="text" id="username" value="HomoSapiens11" placeholder="Твой Ник" onchange="registerMe()">
            </div>
            <div class="chats-list" id="chats-list">
                <div class="chat-item active" id="chat-GLOBAL" onclick="switchChat('GLOBAL')">
                    <span class="chat-name">🌐 ОБЩИЙ ЧАТ</span>
                </div>
            </div>
        </div>

        <!-- ОКНО ТЕКУЩЕГО ЧАТА -->
        <div class="main-chat">
            <div class="chat-header">
                <span id="current-chat-title">🌐 ОБЩИЙ ЧАТ</span>
                <span style="font-size: 11px; color: #666;">INANE 4.0 // ETERNAL</span>
            </div>
            <div class="messages-box" id="messages"></div>
            
            <div class="input-area">
                <input type="text" id="msgInput" placeholder="Напишите сообщение...">
                <button onclick="sendMsg()">Отправить</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let currentChat = 'GLOBAL';
        let onlineUsers = [];

        function getMyNick() {
            return document.getElementById('username').value.trim() || 'Аноним';
        }

        function registerMe() {
            socket.emit('register user', getMyNick());
            // Перезапрашиваем историю для текущего активного чата после смены ника
            socket.emit('get history', { target: currentChat, myNick: getMyNick() });
        }

        // Авторизация при старте
        setTimeout(registerMe, 500);

        // Обновление списка контактов в сайдбаре
        socket.on('update users', function(usersArray) {
            onlineUsers = usersArray;
            const myNick = getMyNick();
            
            // Сохраняем элемент Глобального чата
            const chatsList = document.getElementById('chats-list');
            chatsList.innerHTML = `
                <div class="chat-item ${currentChat === 'GLOBAL' ? 'active' : ''}" id="chat-GLOBAL" onclick="switchChat('GLOBAL')">
                    <span class="chat-name">🌐 ОБЩИЙ ЧАТ</span>
                </div>
            `;

            // Добавляем остальных пользователей как приватные чаты
            usersArray.forEach(user => {
                if (user !== myNick) {
                    const div = document.createElement('div');
                    div.className = `chat-item ${currentChat === user ? 'active' : ''}`;
                    div.id = `chat-${user}`;
                    div.onclick = () => switchChat(user);
                    div.innerHTML = `
                        <span class="chat-name">👤 ${user}</span>
                        <span class="online-tag">online</span>
                    `;
                    chatsList.appendChild(div);
                }
            });
        });

        // Переключение между комнатами/приватками
        function switchChat(target) {
            currentChat = target;
            
            // Смена активного класса в дизайне
            document.querySelectorAll('.chat-item').forEach(el => el.classList.remove('active'));
            const activeEl = document.getElementById(`chat-${target}`);
            if (activeEl) activeEl.classList.add('active');

            // Смена заголовка чата
            document.getElementById('current-chat-title').innerText = target === 'GLOBAL' ? '🌐 ОБЩИЙ ЧАТ' : `👤 ЛИЧКА: ${target}`;
            
            // Очищаем окно и запрашиваем историю из базы
            document.getElementById('messages').innerHTML = '';
            socket.emit('get history', { target: target, myNick: getMyNick() });
        }

        // Отрисовка истории из MongoDB Atlas
        socket.on('load history', function(data) {
            if (data.target !== currentChat) return; // Защита от наложения комнат
            const messagesBox = document.getElementById('messages');
            messagesBox.innerHTML = '';

            if (Array.isArray(data.history)) {
                data.history.forEach(msg => appendMessageElement(msg));
            }
        });

        // Прием новых живых сообщений
        socket.on('new message', function(msg) {
            const myNick = getMyNick();
            
            // Проверяем, относится ли сообщение к текущему открытому экрану
            if (currentChat === 'GLOBAL' && msg.to === 'GLOBAL') {
                appendMessageElement(msg);
            } else if (currentChat !== 'GLOBAL' && msg.to !== 'GLOBAL') {
                // Если открыта личка с конкретным юзером и сообщение от него ИЛИ вы отправили ему
                if ((msg.sender === currentChat && msg.to === myNick) || (msg.sender === myNick && msg.to === currentChat)) {
                    appendMessageElement(msg);
                }
            }
        });

        function appendMessageElement(msg) {
            const messagesBox = document.getElementById('messages');
            const myNick = getMyNick();
            
            const div = document.createElement('div');
            const isMy = msg.sender === myNick;
            
            div.className = `msg ${isMy ? 'my' : 'their'}`;
            
            // Показываем ник автора только в глобальном чате и если это не наше сообщение
            const authorMarkup = (!isMy && currentChat === 'GLOBAL') ? `<div class="msg-author">${msg.sender}</div>` : '';
            
            div.innerHTML = `${authorMarkup}<div>${msg.text}</div>`;
            
            messagesBox.appendChild(div);
            messagesBox.scrollTop = messagesBox.scrollHeight;
        }

        function sendMsg() {
            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            if (!text) return;

            socket.emit('send message', {
                to: currentChat,
                text: text,
                sender: getMyNick()
            });

            input.value = '';
        }

        // Отправка по кнопке Enter
        document.getElementById('msgInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') sendMsg();
        });
    </script>
</body>
</html>
