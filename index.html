<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>INANE 3.0 Chat</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0d0d0d; color: #e0e0e0; padding: 20px; margin: 0; }
        .container { max-width: 1100px; margin: 0 auto; display: flex; gap: 20px; }
        .chat-main { flex: 1; background: #141414; padding: 20px; border-radius: 8px; border: 1px solid #222; }
        h2 { margin-top: 0; color: #00ffcc; text-shadow: 0 0 10px rgba(0, 255, 204, 0.2); }
        #chat-box { width: 100%; height: 450px; border: 1px solid #262626; overflow-y: auto; padding: 15px; background: #080808; border-radius: 6px; box-sizing: border-box; margin-bottom: 15px; }
        .msg { margin-bottom: 10px; line-height: 1.4; padding: 6px 10px; border-radius: 4px; background: #111; }
        .private { color: #ff5252; background: rgba(255, 82, 82, 0.05); border-left: 3px solid #ff5252; }
        .system { color: #ffb142; background: rgba(255, 177, 66, 0.05); border-left: 3px solid #ffb142; }
        .controls { display: flex; gap: 10px; }
        input[type="text"] { background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 10px; border-radius: 4px; outline: none; }
        input[type="text"]:focus { border-color: #00ffcc; }
        #target-user { width: 150px; }
        #message-text { flex: 1; }
        button { background: #00ffcc; color: #000; border: none; padding: 10px 20px; border-radius: 4px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #00cc99; box-shadow: 0 0 10px rgba(0, 255, 204, 0.4); }
        .sidebar { width: 220px; background: #141414; padding: 20px; border-radius: 8px; border: 1px solid #222; }
        .sidebar h3 { margin-top: 0; color: #00ffcc; border-bottom: 1px solid #222; padding-bottom: 8px; }
        #users { list-style: none; padding: 0; margin: 0; }
        #users li { padding: 6px 0; border-bottom: 1px solid #1a1a1a; color: #a0a0a0; display: flex; align-items: center; }
        #users li::before { content: "●"; color: #00ffcc; margin-right: 8px; font-size: 12px; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Основное окно чата -->
        <div class="chat-main">
            <h2>INANE 3.0</h2>
            <div id="chat-box"></div>
            
            <div class="controls">
                <input type="text" id="target-user" placeholder="Кому (пусто для всех)">
                <input type="text" id="message-text" placeholder="Введите ваше сообщение...">
                <button id="send-btn">ОТПРАВИТЬ</button>
            </div>
        </div>

        <!-- Боковая панель списка пользователей -->
        <div class="sidebar">
            <h3>В СЕТИ</h3>
            <ul id="users"></ul>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const chatBox = document.getElementById('chat-box');
        const usersList = document.getElementById('users');
        const msgInput = document.getElementById('message-text');
        const targetInput = document.getElementById('target-user');
        const sendBtn = document.getElementById('send-btn');

        // Спрашиваем имя при входе
        const myName = prompt("Введите ваш ник для авторизации в INANE 3.0:") || "Аноним_" + Math.floor(Math.random() * 1000);
        socket.emit('register user', myName);

        // ШАГ 2: ПРИЕМ И ОТРИСОВКА ИСТОРИИ ИЗ БАЗЫ ДАННЫХ
        socket.on('chat history', (history) => {
            chatBox.innerHTML = ''; 
            history.forEach(msg => {
                displayMessage(msg);
            });
        });

        // Прием новых сообщений (в реальном времени)
        socket.on('chat message', (data) => {
            displayMessage(data);
        });

        // Обновление списка активных юзеров в статус-баре
        socket.on('update users', (users) => {
            usersList.innerHTML = '';
            users.forEach(user => {
                const li = document.createElement('li');
                li.textContent = user === myName ? `${user} (Вы)` : user;
                usersList.appendChild(li);
            });
        });

        // Логика отправки
        function sendMessage() {
            const text = msgInput.value.trim();
            const to = targetInput.value.trim();

            if (!text) return;

            if (to) {
                // Приватное сообщение
                socket.emit('private message', { to: to, text: text });
            } else {
                // Общее сообщение
                socket.emit('general message', { text: text });
            }
            msgInput.value = '';
        }

        sendBtn.addEventListener('click', sendMessage);
        msgInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

        // Отрисовка сообщения на экране
        function displayMessage(data) {
            const div = document.createElement('div');
            div.classList.add('msg');

            if (data.isPrivate) {
                div.classList.add('private');
                if (data.sender === 'СИСТЕМА') {
                    div.classList.add('system');
                    div.textContent = `[СИСТЕМА]: ${data.text}`;
                } else {
                    const direction = data.to ? `для ${data.to}` : `от ${data.sender}`;
                    const displaySender = data.to ? `Вы` : data.sender;
                    div.textContent = `[ЛС] ${displaySender} (${direction}): ${data.text}`;
                }
            } else {
                div.textContent = `${data.sender}: ${data.text}`;
            }

            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight; // Авто-скролл вниз
        }
    </script>
</body>
</html>

    </script>
</body>
</html>
