<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>INANE 3.0 — Absolute Freedom</title>
    <style>
        body { background: #0a0a0a; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .chat-card { width: 420px; background: #111; padding: 25px; border-radius: 15px; box-shadow: 0 0 25px rgba(0,255,200,0.25); border: 1px solid #222; text-align: center; }
        h1 { color: #00ffcc; letter-spacing: 3px; margin: 0 0 5px 0; }
        p { color: #666; font-size: 11px; margin-bottom: 20px; }
        #online-box { font-size: 12px; color: #00ffcc; margin-bottom: 10px; text-align: left; background: #161616; padding: 8px; border-radius: 6px; border: 1px solid #222; }
        #messages { height: 250px; overflow-y: auto; background: #161616; border-radius: 8px; padding: 10px; text-align: left; margin-bottom: 15px; border: 1px solid #222; font-size: 13px; }
        .msg { margin-bottom: 8px; word-break: break-all; }
        .user { color: #00ffcc; font-weight: bold; }
        .system-user { color: #ffb142; font-weight: bold; }
        .private-tag { background: #ff0055; color: #fff; padding: 2px 5px; border-radius: 4px; font-size: 10px; font-weight: bold; margin-right: 5px; }
        input { width: 100%; padding: 10px; margin-bottom: 8px; border-radius: 8px; border: 1px solid #333; background: #222; color: #fff; box-sizing: border-box; outline: none; font-size: 13px; }
        input:focus { border-color: #00ffcc; }
        button { width: 100%; padding: 12px; background: #00ffcc; color: #000; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; }
        button:hover { background: #00cca3; }
    </style>
</head>
<body>

    <div class="chat-card">
        <h1>INANE 3.0</h1>
        <p>ABSOLUTE FREEDOM // ETERNAL STORAGE</p>
        
        <div id="online-box">🟢 В сети: <span id="users-list">загрузка...</span></div>
        <div id="messages"></div>

        <input type="text" id="username" placeholder="Твой Ник" value="HomoSapiens11">
        <input type="text" id="targetUser" placeholder="Кому (Ник для ЛИЧКИ) или пусто для общего">
        <input type="text" id="msgInput" placeholder="Напиши сообщение...">
        <button onclick="sendMsg()">Отправить</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const messagesDiv = document.getElementById('messages');
        const usersListSpan = document.getElementById('users-list');

        // Авто-регистрация при входе
        function initUser() {
            const myNick = document.getElementById('username').value.trim() || 'Аноним';
            socket.emit('register user', myNick);
        }

        document.getElementById('username').addEventListener('change', initUser);
        setTimeout(initUser, 1000); // Автоподключение через 1 сек

        socket.on('update users', function(usersArray) {
            usersListSpan.innerHTML = usersArray.join(', ');
        });

        // Исправлено: Удален мусорный текст нейросети, мешавший работе скрипта
        socket.on('load history', function(historyArray) {
            messagesDiv.innerHTML = '';
            if (Array.isArray(historyArray)) {
                historyArray.forEach(data => renderMessage(data));
            }
        });

        socket.on('chat message', function(data) {
            renderMessage(data);
        });

        function renderMessage(data) {
            if (!data || !data.text) return;
            
            const item = document.createElement('div');
            item.className = 'msg';
            
            if (data.isPrivate) {
                if (data.sender === 'СИСТЕМА') {
                    // Красивый вывод системных предупреждений о доставке приваток
                    item.innerHTML = `<span class="private-tag" style="background:#ffb142;">СИСТЕМА</span> <span class="system-user">${data.text}</span>`;
                } else {
                    const targetText = data.to ? ` ДЛЯ ${data.to}` : '';
                    item.innerHTML = `<span class="private-tag">ЛИЧКА${targetText}</span> <span class="user">${data.sender || 'Аноним'}:</span> ${data.text}`;
                }
            } else {
                item.innerHTML = `<span class="user">${data.sender || 'Аноним'}:</span> ${data.text}`;
            }

            messagesDiv.appendChild(item);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function sendMsg() {
            const target = document.getElementById('targetUser').value.trim();
            const input = document.getElementById('msgInput');
            const text = input.value.trim();

            if (text !== '') {
                // Исправлено: Удален лишний дублирующий socket.emit('register user'), вызывавший перезагрузку истории

                if (target !== '') {
                    socket.emit('private message', { to: target, text: text });
                } else {
                    socket.emit('chat message', text);
                }

                input.value = '';
            }
        }

        // Отправка по кнопке Enter
        document.getElementById('msgInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                sendMsg();
            }
        });
    </script>
</body>
</html>
